# TNT Library configuration
# See docs/PLUGIN_CHECKLIST.md for the full scope. Bad values degrade to the defaults shown here
# with a WARNING naming the key; they never fail plugin startup.

# Master switch for the whole plugin.
enabled: true

# Per-bomb toggles. Dangerous bombs default to false on a public server; operators opt in.
bombs:
  waterbomb:
    enabled: true
    radius: 4
    fuse-ticks: 80
  twins:
    enabled: true
    radius: 3            # beam/trench thickness (per-sample blast power, clamped 1..8)
    fuse-ticks: 80
    max-pair-distance: 64  # a Twin fizzles if its nearest opposite is farther than this (blocks)
  smartbomb:
    enabled: true
    default-radius: 4
    default-delay-ticks: 100
    # Trigger defaults a freshly placed Smart Bomb is seeded with; a player's programming overrides
    # them. proximity/time triggers default off, so an unprogrammed Smart Bomb behaves like a plain
    # timed fuse (default-delay-ticks).
    default-proximity-radius: 6
    proximity-default: false
    time-trigger-default: false
  fbomb:
    enabled: false
    radius: 6                 # blast radius of the final detonation
    fuse-ticks: 60
    menace-ticks: 60          # total show length in ticks (summon + menace), floor 20; blast at the end
    spawn-distance: 12        # how far from the bomb the apparition is summoned
    spawn-height: 6           # how high above the bomb the apparition floats
    bossbar-range: 48         # players within this range see the boss bar
    skull-count: 6            # wither-skulls lobbed during the menace phase
    skull-cadence-ticks: 8    # ticks between skulls
  gbomb:
    enabled: false
    radius: 20
    fuse-ticks: 60
    hang-ticks: 50
    launch-power: 1.2     # upward launch magnitude (clamped 0..3; kept modest per Paper #13270)
    kill-damage: 1000     # server-side FALL finisher damage applied on the slam. This is the kill
                          # guarantee: on Bedrock via Geyser the float/launch is weak or absent
                          # (setGravity(false) is not translated; player velocity is client-authoritative),
                          # but this finisher lands regardless of client physics. Accepted, documented.
  whiteout:
    enabled: false
    pull-radius: 24       # horizontal reach of the vortex, and the radius of the permanent scar.
                          # WARNING: the scar is PERMANENT and sizable — at radius 24 it whites over
                          # roughly 1,800 surface columns to white_concrete and never reverts. Size
                          # this to an arena, not to spawn.
    fuse-ticks: 100
    pull-power: 1.0       # escalating inward per-tick velocity ceiling (clamped 0..3). Bedrock note:
                          # player velocity is client-authoritative, so the pull may read weaker on
                          # Bedrock; the kill does NOT depend on it (see kill-damage).
    pull-ticks: 60        # the ACTIVE pull window — how long entities are dragged inward before the
                          # collapse (clamped 1..1200). Distinct from effect-ticks below.
    kill-damage: 1000     # server-side FREEZE finisher damage applied to every caught entity at the
                          # collapse (clamped 1..1000000). This is the kill guarantee: as with the
                          # G-Bomb, client physics can't be trusted on Bedrock, but this finisher lands
                          # regardless of client rendering.
    effect-ticks: 100     # how long the blindness/slowness/freeze debuff LINGERS (clamped 1..1200).
                          # Distinct from pull-ticks: nearly every caught entity dies at the collapse,
                          # so this mainly governs a rare survivor of the finisher.

# Region / claim protection. When respect-regions is true, explosions, the Water Bomb crater-fill,
# and the White Out pull skip protected regions where a supported provider is present.
protection:
  respect-regions: true
  provider: auto   # auto | worldguard | griefprevention | none

# Resource-pack delivery. Left empty here; a released build bakes in a CI-generated URL + SHA-1
# (added at the dev gate). Empty = delivery disabled (INFO, not an error).
resource-pack:
  url: ''
  sha1: ''
  required: false
