# Built-in fallback resource-pack URL and SHA-1, baked into the plugin JAR at build time.
#
# org.xpfarm.tntlibrary.config.PackDefaults and TntLibraryConfig use these values only when
# config.yml leaves resource-pack.url / resource-pack.sha1 empty -- see TntLibraryConfig for the
# full resolution order (a non-empty operator value in config.yml always wins).
#
# This file solves a chicken-and-egg problem: the pack's real SHA-1 can only be computed AFTER
# PackSquash rewrites the release zip, but this file is baked into the JAR during `mvn package`,
# which historically ran BEFORE PackSquash. CI now runs PackSquash first, hashes its output, and
# re-invokes Maven with -Dtnt.pack.sha1=<hash> so that hash lands here in the same build whose JAR
# ships it. See .github/workflows/build.yml.
#
# This file MUST stay in the Maven-FILTERED resource block in pom.xml (pack.url below needs its
# Maven property placeholder resolved) -- never the unfiltered block that protects the PNG-bearing
# pack/ and geyser/ trees.
#
# pack.url needs no CI cooperation at all: it is fully derivable from the release tag Maven already
# knows.
pack.url=https://github.com/carmelosantana/minecraft-tnt-library/releases/download/v${project.version}/tnt-library-pack-${project.version}.zip

# pack.sha1 resolves to the `tnt.pack.sha1` POM property, which defaults to empty. A plain local
# build (no -Dtnt.pack.sha1) therefore ships this file with an empty hash -- identical, from
# TntLibraryConfig's point of view, to an operator who has not configured a pack yet.
pack.sha1=${tnt.pack.sha1}
